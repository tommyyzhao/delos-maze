<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
  <script>try { const theme = localStorage.getItem('delos-maze-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch {}</script>
  <title>DELOS Maze</title><meta name="description" content="Tilt-maze speedrun."><meta name="theme-color" content="#11161c">
  <meta property="og:title" content="DELOS Maze"><meta property="og:description" content="Tilt-maze speedrun."><meta property="og:url" content="https://maze.tz.mt"><meta property="og:image" content="https://maze.tz.mt/og.png"><meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2311161c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2365e5ed' stroke-width='4'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css">
  <!-- Fetch the whole module graph in parallel instead of a 6-deep import waterfall. -->
  <link rel="modulepreload" href="./app.js"><link rel="modulepreload" href="./maze-view.js"><link rel="modulepreload" href="./maze.mjs"><link rel="modulepreload" href="./det-math.mjs"><link rel="modulepreload" href="./maze-data.mjs"><link rel="modulepreload" href="./replay.mjs">
  <link rel="modulepreload" href="./maze-renderer.mjs"><link rel="modulepreload" href="./maze-geometry.mjs"><link rel="modulepreload" href="./vendor/three/three.module.js"><link rel="modulepreload" href="./vendor/three/three.core.js">
</head>
<body>
<header class="topbar">
  <span class="logo">DELOS</span>
  <details id="maze-menu" class="maze-menu"><summary aria-label="Menu">☰</summary><div class="maze-menu-content"><select id="maze-theme" aria-label="Theme"><option value="dark">Dark</option><option value="light">Light</option></select><a href="https://github.com/tommyyzhao/delos-maze">Source</a></div></details>
</header>
<main class="maze-stage">
  <div class="maze-surface">
    <canvas id="maze-canvas" tabindex="-1" aria-label="Tilt maze" aria-describedby="maze-help"></canvas>
    <div id="maze-goal-label" class="maze-goal-annotation" aria-hidden="true" hidden><svg class="maze-goal-arrow"><path></path></svg><span class="maze-goal-label">GOAL</span></div>
    <div class="maze-hud" aria-hidden="true"><span id="maze-who" hidden></span><span id="maze-time" hidden>0:00.00</span></div>
    <button id="maze-stop" class="maze-stop" type="button" aria-label="Close replay" hidden>✕</button>
    <div id="maze-pad" class="maze-pad" aria-hidden="true" hidden><span id="maze-pad-dot" class="maze-pad-dot"></span></div>
    <button id="maze-start" class="maze-start" type="button">Loading…</button>
    <button id="maze-retry" class="maze-start" type="button" hidden>Failed to load. Retry</button>
  </div>
</main>
<p id="maze-help" class="sr-only">Cursor or drag to tilt, arrow keys also work. R restarts.</p>
<p id="maze-status" class="sr-only" role="status"></p>
<dialog id="maze-end" class="maze-end" aria-label="Result" tabindex="-1">
  <div class="maze-panel">
    <div id="maze-end-time" class="maze-big"></div>
    <div id="maze-end-best" class="maze-best"></div>
    <form id="maze-form"><input id="maze-name" name="name" placeholder="NAME" aria-label="Name" maxlength="16" required autocomplete="off" pattern="[A-Za-z0-9 _\-]{1,16}" title="1-16: letters, digits, space, _ -"><button id="maze-submit" type="submit">SUBMIT</button></form>
    <p id="maze-note" class="maze-note" role="status"></p>
    <ol id="maze-board" class="maze-board"></ol>
    <button id="maze-again" class="maze-again" type="button">PLAY AGAIN</button>
  </div>
</dialog>
<noscript><p>JavaScript required.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
